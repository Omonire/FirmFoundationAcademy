    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F3F4F6; }
        ::-webkit-scrollbar-thumb { background: #0D2420; border-radius: 4px; }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-img {
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .gallery-img:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        /* ============================================
           LIGHTBOX STYLES
           TO REMOVE LIGHTBOX: Delete everything between
           the two LIGHTBOX comment lines below,
           then delete the lightbox HTML div and
           the lightbox JavaScript at the bottom.
        ============================================ */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #lightbox-prev, #lightbox-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 40px;
            line-height: 1;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, opacity 0.2s ease;
            z-index: 10;
        }
        #lightbox-prev { left: 16px; }
        #lightbox-next { right: 16px; }
        #lightbox-prev:hover, #lightbox-next:hover {
            background: rgba(255,255,255,0.22);
        }
        #lightbox-prev[disabled], #lightbox-next[disabled] {
            opacity: 0.25;
            cursor: default;
        }
        @media (max-width: 640px) {
            #lightbox-prev, #lightbox-next {
                width: 44px;
                height: 44px;
                font-size: 30px;
            }
            #lightbox-prev { left: 6px; }
            #lightbox-next { right: 6px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #lightbox img,
            #lightbox-prev, #lightbox-next { transition: none; }
        }
        #lightbox.active {
            display: flex;
        }
        #lightbox img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            border-radius: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        @media (min-width: 1024px) {
            #lightbox img {
                width: 90vw;
                height: 90vh;
                object-fit: contain;
            }
        }
        #lightbox img.slide-out-left {
            transform: translateX(-50px);
            opacity: 0;
        }
        #lightbox img.slide-out-right {
            transform: translateX(50px);
            opacity: 0;            
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 10;
            background: none;
            border: none;
            padding: 0 4px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
        }
        #lightbox-caption {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
        }
        /* ============================================
           END LIGHTBOX STYLES
        ============================================ */

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25D366;
            color: white;
            border-radius: 50px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            z-index: 50;
            transition: transform 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

    <script>
        lucide.createIcons();

        async function loadIncludes() {
    const [headerHTML, footerHTML] = await Promise.all([
        fetch('header.html').then(r => r.text()),
        fetch('footer.html').then(r => r.text())
    ]);
    document.getElementById('header-placeholder').innerHTML = headerHTML;
    document.getElementById('footer-placeholder').innerHTML = footerHTML;

    const currentPage = document.body.getAttribute('data-page');
    document.querySelectorAll('[data-nav]').forEach(link => {
        if (link.getAttribute('data-nav') === currentPage) {
            link.classList.add('text-secondary', 'font-bold');
        }
    });

    lucide.createIcons();

    const mobileBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const mobileLinks = document.querySelectorAll('.mobile-link');
    let isMenuOpen = false;
    let navigating = false;

    const navbar = document.getElementById('navbar');

    const updateNavbarState = () => {
        if (window.scrollY > 40 || isMenuOpen) {
            navbar.classList.add('solid');
        } else {
            navbar.classList.remove('solid');
        }
    };

    const closeMenu = (callback) => {
        isMenuOpen = false;
        mobileMenu.classList.remove('menu-open');
        mobileBtn.classList.remove('open');
        if (window.scrollY <= 40) {
            navbar.classList.remove('solid');
        }
        if (callback) {
            setTimeout(callback, 300);
        }
    };

    const toggleMenu = () => {
        isMenuOpen = !isMenuOpen;
        if (isMenuOpen) {
            mobileMenu.classList.add('menu-open');
            mobileBtn.classList.add('open');
            navbar.classList.add('solid');
        } else {
            mobileMenu.classList.remove('menu-open');
            mobileBtn.classList.remove('open');
            if (window.scrollY <= 40) {
                navbar.classList.remove('solid');
            }
        }
    };

    window.addEventListener('scroll', updateNavbarState);
    updateNavbarState();

    mobileBtn.addEventListener('click', toggleMenu);
    mobileBtn.setAttribute('aria-expanded', 'false');
    mobileBtn.addEventListener('click', () => {
        mobileBtn.setAttribute('aria-expanded', isMenuOpen ? 'true' : 'false');
    });
    mobileLinks.forEach(link => link.addEventListener('click', (e) => {
        if (!isMenuOpen) return;
        // Let modified clicks (new tab, download) behave normally.
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        const destination = link.href;
        if (navigating) return;   // ignore repeat taps while navigating
        navigating = true;
        closeMenu(() => { window.location.href = destination; });
    }));
}

document.addEventListener('DOMContentLoaded', () => {
    loadIncludes();

    const revealElements = document.querySelectorAll('.reveal');
    const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('active');
                observer.unobserve(entry.target);
            }
        });
    }, { root: null, threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

    revealElements.forEach(el => revealObserver.observe(el));
    });

        /*
        ============================================
        LIGHTBOX JAVASCRIPT
        TO REMOVE LIGHTBOX: Delete the two functions below
        ============================================
        */
        let galleryPhotos = [];
let currentPhotoIndex = 0;

document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.gallery-img').forEach((img, index) => {
        galleryPhotos.push({ src: img.src, caption: img.alt });
        img.addEventListener('click', () => { currentPhotoIndex = index; });
    });
});

const lightboxEl = document.getElementById('lightbox');
const lightboxCaptionEl = document.getElementById('lightbox-caption');
const prevBtn = document.getElementById('lightbox-prev');
const nextBtn = document.getElementById('lightbox-next');
let lastFocused = null;

function updateLightboxNav() {
    if (prevBtn) prevBtn.disabled = currentPhotoIndex === 0;
    if (nextBtn) nextBtn.disabled = currentPhotoIndex === galleryPhotos.length - 1;
}

function stepPhoto(delta) {
    const target = currentPhotoIndex + delta;
    if (target < 0 || target >= galleryPhotos.length) return;
    currentPhotoIndex = target;
    lightboxImg.src = galleryPhotos[target].src;
    lightboxCaptionEl.textContent = galleryPhotos[target].caption;
    lightboxImgNext.style.opacity = '0';
    updateLightboxNav();
}

if (prevBtn) prevBtn.addEventListener('click', () => stepPhoto(-1));
if (nextBtn) nextBtn.addEventListener('click', () => stepPhoto(1));

function showPhotoAtIndex(index, direction) {
    if (index < 0 || index >= galleryPhotos.length) return;

    currentPhotoIndex = index;
    lightboxImg.src = galleryPhotos[index].src;
    document.getElementById('lightbox-caption').textContent = galleryPhotos[index].caption;
    lightboxImg.style.transform = 'translateX(0)';
    lightboxImgNext.style.opacity = '0';
}

let touchStartX = 0;
let touchCurrentX = 0;
let isDragging = false;
let rafPending = false;
let pendingDragX = 0;
let neighbourPrimed = 0;

const lightboxImg = document.getElementById('lightbox-img');
const lightboxImgNext = document.getElementById('lightbox-img-next');

lightboxEl.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) {
        isDragging = false;
        return;
    }
    touchStartX = e.changedTouches[0].screenX;
    touchCurrentX = touchStartX;
    isDragging = true;
    neighbourPrimed = 0;
    lightboxImg.style.transition = 'none';
    lightboxImgNext.style.transition = 'none';
}, { passive: true });

lightboxEl.addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) return;
    if (!isDragging) return;
    touchCurrentX = e.changedTouches[0].screenX;
    pendingDragX = touchCurrentX;
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
        rafPending = false;
        renderDrag(pendingDragX);
    });
}, { passive: true });

function renderDrag(currentX) {
    let dragDistance = currentX - touchStartX;

    const atFirst = currentPhotoIndex === 0;
    const atLast = currentPhotoIndex === galleryPhotos.length - 1;

    if (atFirst && dragDistance > 0) dragDistance = dragDistance / 4;
    if (atLast && dragDistance < 0) dragDistance = dragDistance / 4;

    lightboxImg.style.transform = `translateX(${dragDistance}px)`;

    if (dragDistance < 0 && !atLast) {
        primeNeighbour(1);
        lightboxImgNext.style.opacity = '1';
        lightboxImgNext.style.transform = `translate(calc(-50% + ${dragDistance + window.innerWidth}px), -50%)`;
    } else if (dragDistance > 0 && !atFirst) {
        primeNeighbour(-1);
        lightboxImgNext.style.opacity = '1';
        lightboxImgNext.style.transform = `translate(calc(-50% + ${dragDistance - window.innerWidth}px), -50%)`;
    } else {
        lightboxImgNext.style.opacity = '0';
    }
}

// Only assign .src when the neighbour actually changes, so a long drag
// does not kick off a fresh network request on every frame.
function primeNeighbour(direction) {
    if (neighbourPrimed === direction) return;
    neighbourPrimed = direction;
    lightboxImgNext.src = galleryPhotos[currentPhotoIndex + direction].src;
}

function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    if (rafPending) {
        rafPending = false;
        renderDrag(touchCurrentX);
    }

    const diff = touchStartX - touchCurrentX;
    const threshold = 50;
    const goingNext = diff > threshold && currentPhotoIndex < galleryPhotos.length - 1;
    const goingPrev = diff < -threshold && currentPhotoIndex > 0;

    if (goingNext || goingPrev) {
        const newIndex = goingNext ? currentPhotoIndex + 1 : currentPhotoIndex - 1;

        lightboxImgNext.style.transition = 'transform 0.3s ease';
        lightboxImgNext.style.transform = 'translate(-50%, -50%)';

        lightboxImg.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
        lightboxImg.style.opacity = '0';

        setTimeout(() => {
            currentPhotoIndex = newIndex;
            lightboxImg.src = galleryPhotos[newIndex].src;
            document.getElementById('lightbox-caption').textContent = galleryPhotos[newIndex].caption;

            lightboxImgNext.style.transition = 'none';
            lightboxImgNext.style.opacity = '0';

            requestAnimationFrame(() => {
                lightboxImg.style.transition = 'none';
                lightboxImg.style.transform = 'translateX(0)';
                lightboxImg.style.opacity = '1';
            });
        }, 300);

        neighbourPrimed = 0;
        updateLightboxNav();
    } else {
        lightboxImg.style.transition = 'transform 0.3s ease';
        lightboxImg.style.transform = 'translateX(0)';
        lightboxImgNext.style.transition = 'opacity 0.2s ease';
        lightboxImgNext.style.opacity = '0';
    }
}

lightboxEl.addEventListener('touchend', endDrag);
lightboxEl.addEventListener('touchcancel', () => { isDragging = false; });

function openLightbox(src, caption) {
    lastFocused = document.activeElement;
    lightboxImg.src = src;
    lightboxCaptionEl.textContent = caption;
    lightboxEl.classList.add('active');
    lightboxEl.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    updateLightboxNav();
    if (nextBtn) nextBtn.focus();
    window.location.hash = 'lightbox-open';
}

function closeLightbox() {
    if (!lightboxEl.classList.contains('active')) return;
    lightboxEl.classList.remove('active');
    lightboxEl.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    neighbourPrimed = 0;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
    lastFocused = null;
}

window.addEventListener('hashchange', () => {
    if (window.location.hash !== '#lightbox-open') {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
    }
});

        document.addEventListener('keydown', (e) => {
            if (!lightboxEl.classList.contains('active')) return;
            if (e.key === 'Escape') {
                e.preventDefault();
                closeLightbox();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                stepPhoto(1);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                stepPhoto(-1);
            } else if (e.key === 'Tab') {
                // keep focus inside the dialog while it is open
                const focusables = lightboxEl.querySelectorAll('button:not([disabled])');
                if (!focusables.length) return;
                const first = focusables[0];
                const last = focusables[focusables.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });
        /*

        END LIGHTBOX JAVASCRIPT
        ============================================

    </script>
