    <meta name="description" content="Browse photos from Firm Foundation Academy — classrooms, events, sports, and more.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://pmdnmmyoomecrycsjwoa.supabase.co/storage/v1/object/public/Firm%20Foundation%20images/ffa.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D2420',
                        secondary: '#FACC15',
                        secondaryHover: '#EAB308',
                        light: '#F3F4F6',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F3F4F6; }
        ::-webkit-scrollbar-thumb { background: #0D2420; border-radius: 4px; }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-img {
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .gallery-img:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        /* ============================================
           LIGHTBOX STYLES
           TO REMOVE LIGHTBOX: Delete everything between
           the two LIGHTBOX comment lines below,
           then delete the lightbox HTML div and
           the lightbox JavaScript at the bottom.
        ============================================ */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #lightbox.active {
            display: flex;
        }
        #lightbox img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            border-radius: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        @media (min-width: 1024px) {
            #lightbox img {
                width: 90vw;
                height: 90vh;
                object-fit: contain;
            }
        }
        #lightbox img.slide-out-left {
            transform: translateX(-50px);
            opacity: 0;
        }
        #lightbox img.slide-out-right {
            transform: translateX(50px);
            opacity: 0;            
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
        }
        #lightbox-caption {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
        }
        /* ============================================
           END LIGHTBOX STYLES
        ============================================ */

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25D366;
            color: white;
            border-radius: 50px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            z-index: 50;
            transition: transform 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

    <div id="footer-placeholder"></div>

    <!-- ============================================
         LIGHTBOX HTML
         TO REMOVE LIGHTBOX: Delete this entire div below
    ============================================ -->
    <div id="lightbox" onclick="closeLightbox()">
        <span id="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="">
<img id="lightbox-img-next" src="" alt="" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100vw; max-height: 100vh; object-fit: contain; border-radius: 0px; opacity: 0;">
        <p id="lightbox-caption"></p>
    </div>
    <!-- ============================================
         END LIGHTBOX HTML
    ============================================ -->

    <script>
        lucide.createIcons();

        async function loadIncludes() {
    const [headerHTML, footerHTML] = await Promise.all([
        fetch('header.html').then(r => r.text()),
        fetch('footer.html').then(r => r.text())
    ]);
    document.getElementById('header-placeholder').innerHTML = headerHTML;
    document.getElementById('footer-placeholder').innerHTML = footerHTML;

    const currentPage = document.body.getAttribute('data-page');
    document.querySelectorAll('[data-nav]').forEach(link => {
        if (link.getAttribute('data-nav') === currentPage) {
            link.classList.add('text-secondary', 'font-bold');
        }
    });

    lucide.createIcons();

    const mobileBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const mobileLinks = document.querySelectorAll('.mobile-link');
    let isMenuOpen = false;

    const navbar = document.getElementById('navbar');

    const updateNavbarState = () => {
        if (window.scrollY > 40 || isMenuOpen) {
            navbar.classList.add('solid');
        } else {
            navbar.classList.remove('solid');
        }
    };

    const closeMenu = (callback) => {
        isMenuOpen = false;
        mobileMenu.classList.remove('menu-open');
        mobileBtn.classList.remove('open');
        if (window.scrollY <= 40) {
            navbar.classList.remove('solid');
        }
        if (callback) {
            setTimeout(callback, 300);
        }
    };

    const toggleMenu = () => {
        isMenuOpen = !isMenuOpen;
        if (isMenuOpen) {
            mobileMenu.classList.add('menu-open');
            mobileBtn.classList.add('open');
            navbar.classList.add('solid');
        } else {
            mobileMenu.classList.remove('menu-open');
            mobileBtn.classList.remove('open');
            if (window.scrollY <= 40) {
                navbar.classList.remove('solid');
            }
        }
    };

    window.addEventListener('scroll', updateNavbarState);
    updateNavbarState();

    mobileBtn.addEventListener('click', toggleMenu);
    mobileLinks.forEach(link => link.addEventListener('click', (e) => {
        if (isMenuOpen) {
            e.preventDefault();
            const destination = link.getAttribute('href');
            closeMenu(() => {
                window.location.href = destination;
            });
        }
    }));
}

document.addEventListener('DOMContentLoaded', () => {
    loadIncludes();

    const revealElements = document.querySelectorAll('.reveal');
    const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('active');
                observer.unobserve(entry.target);
            }
        });
    }, { root: null, threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

    revealElements.forEach(el => revealObserver.observe(el));
    });

        /*
        ============================================
        LIGHTBOX JAVASCRIPT
        TO REMOVE LIGHTBOX: Delete the two functions below
        ============================================
        */
        let galleryPhotos = [];
let currentPhotoIndex = 0;

document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.gallery-img').forEach((img, index) => {
        galleryPhotos.push({ src: img.src, caption: img.alt });
        img.addEventListener('click', () => { currentPhotoIndex = index; });
    });
});

function showPhotoAtIndex(index, direction) {
    if (index < 0 || index >= galleryPhotos.length) return;

    currentPhotoIndex = index;
    lightboxImg.src = galleryPhotos[index].src;
    document.getElementById('lightbox-caption').textContent = galleryPhotos[index].caption;
    lightboxImg.style.transform = 'translateX(0)';
    lightboxImgNext.style.opacity = '0';
}

let touchStartX = 0;
let touchCurrentX = 0;
let isDragging = false;

const lightboxImg = document.getElementById('lightbox-img');
const lightboxImgNext = document.getElementById('lightbox-img-next');

document.getElementById('lightbox').addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) {
        isDragging = false;
        return;
    }
    touchStartX = e.changedTouches[0].screenX;
    touchCurrentX = touchStartX;
    isDragging = true;
    lightboxImg.style.transition = 'none';
    lightboxImgNext.style.transition = 'none';
});

document.getElementById('lightbox').addEventListener('touchmove', (e) => {
    if (e.touches.length > 1) return;
    if (!isDragging) return;
    touchCurrentX = e.changedTouches[0].screenX;
    let dragDistance = touchCurrentX - touchStartX;

    const atFirst = currentPhotoIndex === 0;
    const atLast = currentPhotoIndex === galleryPhotos.length - 1;

    if (atFirst && dragDistance > 0) dragDistance = dragDistance / 4;
    if (atLast && dragDistance < 0) dragDistance = dragDistance / 4;

    lightboxImg.style.transform = `translateX(${dragDistance}px)`;

    if (dragDistance < 0 && !atLast) {
        lightboxImgNext.src = galleryPhotos[currentPhotoIndex + 1].src;
        lightboxImgNext.style.opacity = '1';
        lightboxImgNext.style.transform = `translate(calc(-50% + ${dragDistance + window.innerWidth}px), -50%)`;
    } else if (dragDistance > 0 && !atFirst) {
        lightboxImgNext.src = galleryPhotos[currentPhotoIndex - 1].src;
        lightboxImgNext.style.opacity = '1';
        lightboxImgNext.style.transform = `translate(calc(-50% + ${dragDistance - window.innerWidth}px), -50%)`;
    } else {
        lightboxImgNext.style.opacity = '0';
    }
});

document.getElementById('lightbox').addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;

    const diff = touchStartX - touchCurrentX;
    const threshold = 50;
    const goingNext = diff > threshold && currentPhotoIndex < galleryPhotos.length - 1;
    const goingPrev = diff < -threshold && currentPhotoIndex > 0;

    if (goingNext || goingPrev) {
        const newIndex = goingNext ? currentPhotoIndex + 1 : currentPhotoIndex - 1;

        lightboxImgNext.style.transition = 'transform 0.3s ease';
        lightboxImgNext.style.transform = 'translate(-50%, -50%)';

        lightboxImg.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
        lightboxImg.style.opacity = '0';

        setTimeout(() => {
            currentPhotoIndex = newIndex;
            lightboxImg.src = galleryPhotos[newIndex].src;
            document.getElementById('lightbox-caption').textContent = galleryPhotos[newIndex].caption;

            lightboxImgNext.style.transition = 'none';
            lightboxImgNext.style.opacity = '0';

            requestAnimationFrame(() => {
                lightboxImg.style.transition = 'none';
                lightboxImg.style.transform = 'translateX(0)';
                lightboxImg.style.opacity = '1';
            });
        }, 300);

    } else {
        lightboxImg.style.transition = 'transform 0.3s ease';
        lightboxImg.style.transform = 'translateX(0)';
        lightboxImgNext.style.transition = 'opacity 0.2s ease';
        lightboxImgNext.style.opacity = '0';
    }
});

function openLightbox(src, caption) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox-caption').textContent = caption;
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
    window.location.hash = 'lightbox-open';
}
        function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
    if (window.location.hash === '#lightbox-open') {
        history.back();
    }
}

window.addEventListener('hashchange', () => {
    if (window.location.hash !== '#lightbox-open') {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
    }
});

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });
        /*
        ============================================
        END LIGHTBOX JAVASCRIPT
        ============================================
        */
    </script>

</body>
